spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/ai_fitness_user}
    username: postgres
    password: ${POSTGRES_DB_PASS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${USER_URL:localhost}

server:
  port: 8081
  servlet:
    context-path: /user
