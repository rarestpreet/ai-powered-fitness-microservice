spring:
  mongodb:
    uri: ${MONGO_DB_URL:mongodb://localhost:27017/}
    database: ai_fitness_model_recommendation
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: recommendation-group
      auto-offset-reset: latest
      properties:
        spring.json.value.default.type: com.project.aimodel.model.Activity
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${AI_URL:localhost}

server:
  port: 8083
  servlet:
    context-path: /recommendation

custom:
  gemini:
    api-key: ${API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=