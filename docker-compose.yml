services:
  config-server:
    build: ./Config-Server
    container_name: config
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/user-service/default || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai_fitness

  gateway-service:
    build: ./Api-gateway
    container_name: gateway-service
    ports:
      - "8050:8050"
    environment:
      EUREKA_URL: http://eureka:8080/eureka/
      CONFIG_SERVER_URL: http://config-server:8000
      GATEWAY_URL: gateway-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - ai_fitness

  postgresql:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_fitness_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_fitness

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_fitness

  eureka:
    build: ./Eureka
    container_name: eureka
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka:8080/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai_fitness

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ai_fitness

  activity-service:
    build: ./Activity
    container_name: activity
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/activity/test/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MONGO_DB_URL: mongodb://mongo:27017/
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://eureka:8080/eureka/
      CONFIG_SERVER_URL: http://config-server:8000
      ACTIVITY_URL: activity-service
    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_started
    networks:
      - ai_fitness

  user-service:
    build: ./User
    container_name: user
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/user/test/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_DB_PASS: mysecretpassword
      POSTGRES_DB_URL: jdbc:postgresql://postgresql:5432/ai_fitness_user
      EUREKA_URL: http://eureka:8080/eureka/
      CONFIG_SERVER_URL: http://config-server:8000
      USER_URL: user-service
    depends_on:
      eureka:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_started
    networks:
      - ai_fitness

  ai-service:
    build: ./AIModel
    container_name: aimodel
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/recommendation/test/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MONGO_DB_URL: mongodb://mongo:27017/
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://eureka:8080/eureka/
      CONFIG_SERVER_URL: http://config-server:8000
      AI_URL: ai-service
      API_KEY: ${API_KEY}
    env_file:
      - .env
    depends_on:
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
      activity-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_started
    networks:
      - ai_fitness

networks:
  ai_fitness: