services:

  postgresql:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_fitness_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_fitness
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_fitness

  eureka:
    build: ./Eureka
    container_name: eureka
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai_fitness

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ai_fitness

  activity-service:
    build: ./Activity
    container_name: activity
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ai_fitness

  user-service:
    build: ./User
    container_name: user
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASS: mysecretpassword
    depends_on:
      eureka:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    networks:
      - ai_fitness

  ai-service:
    build: ./AIModel
    container_name: aimodel
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
      activity-service:
        condition: service_healthy
    networks:
      - ai_fitness

networks:
  ai_fitness: