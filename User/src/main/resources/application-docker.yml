spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://postgresql:5432/ai_fitness_user
    username: postgres
    password: ${DB_PASS}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8080/eureka/
